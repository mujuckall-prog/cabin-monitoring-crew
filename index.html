<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>품질 모니터링 점검 결과</title>
  <style>
    :root {
      --brand: #d71920;
      --brand-dark: #a90f15;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --soft: #f9fafb;
      --bg: #f3f4f6;
      --ok: #166534;
      --bad: #b91c1c;
      --card: #ffffff;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      overflow-y: auto;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #fff 0%, var(--bg) 100%);
      line-height: 1.5;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .page {
      max-width: 1040px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }

    .hero {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(229, 231, 235, 0.9);
      margin: -28px -18px 24px;
      padding: 18px;
    }

    .hero-inner {
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .title-wrap { min-width: 0; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--brand);
      font-weight: 800;
      font-size: 17px;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--brand);
      border-radius: 999px;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 34px);
      letter-spacing: -0.045em;
      line-height: 1.15;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: -0.02em;
    }

    .hero-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
      overflow: hidden;
      margin-bottom: 18px;
    }

    .card-head {
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: linear-gradient(90deg, #fff 0%, #fff5f5 100%);
    }

    .card-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.035em;
    }

    .card-desc {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .card-body { padding: 22px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
    }

    .field {
      grid-column: span 6;
      min-width: 0;
    }

    .field.full { grid-column: 1 / -1; }
    .field.third { grid-column: span 4; }

    label.field-label {
      display: block;
      font-weight: 800;
      font-size: 13px;
      margin-bottom: 7px;
      color: #374151;
      letter-spacing: -0.02em;
    }

    input[type="text"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 13px;
      background: #fff;
      color: var(--ink);
      font-size: 15px;
      padding: 12px 13px;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
      font-family: inherit;
    }

    input[type="text"]:focus,
    input[type="date"]:focus,
    select:focus,
    textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(215, 25, 32, 0.10);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .flight-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .prefix {
      flex: 0 0 auto;
      height: 46px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #fecaca;
      background: #fff1f2;
      color: var(--brand-dark);
      border-radius: 13px;
      font-weight: 900;
    }

    .hint {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }


    .category-toggle {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .category-toggle-btn {
      appearance: none;
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #fff;
      color: #374151;
      min-height: 38px;
      padding: 0 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .category-toggle-btn.active {
      border-color: #fecaca;
      background: #fff1f2;
      color: var(--brand-dark);
      box-shadow: 0 0 0 4px rgba(215, 25, 32, 0.08);
    }
    .name-box {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .name-box input { flex: 1; }

    .btn {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      font-weight: 900;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
      white-space: nowrap;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .btn-primary {
      background: var(--brand);
      color: white;
      box-shadow: 0 10px 20px rgba(215, 25, 32, 0.20);
    }

    .btn-primary:hover { background: var(--brand-dark); }

    .btn-ghost {
      background: #fff;
      color: #374151;
      border: 1px solid var(--line);
    }

    .btn-small {
      padding: 10px 12px;
      font-size: 13px;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .progress {
      width: 120px;
      height: 8px;
      border-radius: 999px;
      background: #fee2e2;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--brand);
      border-radius: 999px;
      transition: width .18s ease;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      border-radius: 999px;
      background: #fff1f2;
      color: var(--brand-dark);
      border: 1px solid #fecaca;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .comment-only-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 76px;
      height: 36px;
      padding: 0 13px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .checklist {
      display: grid;
      gap: 14px;
    }

    .item {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
      overflow: hidden;
    }

    .item-top {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--soft);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
    }

    .item-title {
      margin: 0;
      font-size: 15px;
      font-weight: 850;
      letter-spacing: -0.035em;
      word-break: keep-all;
    }

    .choice-group {
      display: inline-flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .choice input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .choice span {
      min-width: 76px;
      height: 36px;
      padding: 0 13px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #fff;
      color: #374151;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      transition: all .15s ease;
    }

    .choice input:checked + span.ok {
      background: #ecfdf5;
      color: var(--ok);
      border-color: #86efac;
      box-shadow: 0 0 0 4px rgba(22, 101, 52, 0.08);
    }

    .choice input:checked + span.bad {
      background: #fef2f2;
      color: var(--bad);
      border-color: #fca5a5;
      box-shadow: 0 0 0 4px rgba(185, 28, 28, 0.08);
    }

    .item-body { padding: 16px 18px 18px; }

    .comment-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      font-size: 13px;
      font-weight: 800;
      color: #4b5563;
      margin-bottom: 8px;
    }

    .char-count {
      font-weight: 700;
      color: #9ca3af;
      font-size: 12px;
    }

    .footer-actions {
      position: sticky;
      bottom: 0;
      z-index: 8;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 -12px 28px rgba(15, 23, 42, 0.08);
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
    }

    .save-note {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.52);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }

    .modal {
      width: min(760px, 100%);
      max-height: 82vh;
      overflow: hidden;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.28);
      display: flex;
      flex-direction: column;
    }

    .modal-head {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.03em;
    }

    .modal-body {
      padding: 18px 20px;
      overflow: auto;
      background: #f8fafc;
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 12px;
      line-height: 1.55;
      color: #111827;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%) translateY(20px);
      background: #111827;
      color: white;
      padding: 12px 16px;
      border-radius: 999px;
      box-shadow: 0 14px 30px rgba(0,0,0,.2);
      font-size: 14px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: all .18s ease;
      z-index: 70;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .required { color: var(--brand); }

    @media (max-width: 760px) {
      .hero-inner,
      .footer-actions {
        align-items: stretch;
        flex-direction: column;
      }
      .hero-actions { justify-content: flex-start; }
      .field, .field.third { grid-column: 1 / -1; }
      .item-top { grid-template-columns: 1fr; }
      .choice-group { justify-content: flex-start; }
      .progress-wrap { justify-content: space-between; }
      .btn { width: 100%; }
  
    .category-toggle {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .category-toggle-btn {
      appearance: none;
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #fff;
      color: #374151;
      min-height: 38px;
      padding: 0 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .category-toggle-btn.active {
      border-color: #fecaca;
      background: #fff1f2;
      color: var(--brand-dark);
      box-shadow: 0 0 0 4px rgba(215, 25, 32, 0.08);
    }
    .name-box { flex-direction: column; align-items: stretch; }

      /* 모바일 상단 버튼(Data 미리보기 / JSON 저장) 숨김 */
      header.hero .hero-actions {
        display: none !important;
      }
    }


    /* 모바일 운영 시 하단에는 JSON 저장 버튼만 표시 */
    @media (max-width: 760px) {
      .footer-actions {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
        border-radius: 18px 18px 0 0;
        margin: 0;
      }

      .footer-actions .save-note,
      .footer-actions #resetBtn,
      .footer-actions #previewBottomBtn {
        display: none !important;
      }

      .footer-actions .hero-actions {
        width: 100%;
        display: block;
      }

      .footer-actions #saveBottomBtn {
        width: 100%;
        min-height: 50px;
        display: flex !important;
        font-size: 15px;
      }

      .page {
        padding-bottom: calc(104px + env(safe-area-inset-bottom));
      }
    }


/* Android keyboard-friendly compact layout */
@media (max-width: 760px) {
  body { line-height: 1.32; min-height: 100svh; touch-action: pan-y; }
  .page { padding: 8px 8px calc(104px + env(safe-area-inset-bottom)) !important; }
  .hero { position: static !important; margin: -8px -8px 8px !important; padding: 10px 10px !important; }
  .eyebrow { font-size: 12px !important; margin-bottom: 3px !important; }
  .eyebrow::before { width: 6px !important; height: 6px !important; }
  h1 { font-size: 18px !important; line-height: 1.18 !important; }
  .subtitle { font-size: 11px !important; margin-top: 3px !important; }
  .card { border-radius: 13px !important; margin-bottom: 9px !important; }
  .card-head { padding: 10px 11px !important; gap: 6px !important; }
  .card-title { font-size: 15px !important; }
  .card-desc { font-size: 11px !important; margin-top: 2px !important; }
  .card-body { padding: 10px !important; }
  .grid { gap: 8px !important; }
  .field, .field.third, .field.full { margin-bottom: 7px !important; }
  label.field-label { font-size: 11px !important; margin-bottom: 4px !important; }
  input[type="text"], input[type="date"], select, textarea {
    font-size: 14px !important;
    min-height: 38px !important;
    padding: 8px 10px !important;
    border-radius: 10px !important;
  }
  textarea { min-height: 72px !important; }
  .prefix { height: 38px !important; padding: 0 10px !important; border-radius: 10px !important; font-size: 13px !important; }
  .hint { font-size: 10px !important; margin-top: 4px !important; }
  .item { border-radius: 13px !important; }
  .item-top { padding: 10px 11px !important; gap: 8px !important; }
  .item-title { font-size: 13px !important; line-height: 1.32 !important; }
  .item-body { padding: 10px 11px 11px !important; }
  .comment-label { font-size: 11px !important; margin-bottom: 5px !important; }
  .char-count { font-size: 10px !important; }
  .choice-group { gap: 6px !important; }
  .choice span { min-width: 62px !important; height: 31px !important; padding: 0 10px !important; font-size: 12px !important; }
  .comment-only-badge { min-width: 62px !important; height: 31px !important; font-size: 12px !important; }
  .progress-wrap { gap: 6px !important; font-size: 11px !important; flex-wrap: wrap; }
  .progress { width: 80px !important; height: 6px !important; }
  .category-badge { padding: 5px 8px !important; font-size: 11px !important; }
  .btn { min-height: 42px !important; padding: 9px 12px !important; font-size: 13px !important; }
  .footer-actions { padding: 8px 10px calc(8px + env(safe-area-inset-bottom)) !important; margin: 0 !important; border-radius: 14px 14px 0 0 !important; }
  .footer-actions #saveBottomBtn { min-height: 44px !important; font-size: 14px !important; }
}

/* iOS Safari/WebView scroll stability: avoid fixed or sticky bottom controls on Apple devices. */
@supports (-webkit-touch-callout: none) {
  html,
  body {
    height: auto !important;
    min-height: 100% !important;
    overflow-x: hidden !important;
    overflow-y: visible !important;
    -webkit-overflow-scrolling: touch;
  }

  body {
    position: static !important;
    touch-action: auto !important;
  }

  .page {
    min-height: auto !important;
    padding-bottom: max(18px, env(safe-area-inset-bottom)) !important;
  }

  .hero,
  .footer-actions {
    position: static !important;
    top: auto !important;
    bottom: auto !important;
    left: auto !important;
    right: auto !important;
    transform: none !important;
  }

  .footer-actions {
    margin: 12px 0 0 !important;
    padding: 10px !important;
    border-radius: 14px !important;
    box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08) !important;
  }
}
@media (max-width: 380px) {
  h1 { font-size: 17px !important; }
  input[type="text"], input[type="date"], select, textarea { font-size: 13px !important; }
  textarea { min-height: 66px !important; }
}



/* Apple OS hard fallback: keep the page as one normal document and avoid scroll traps. */
html.is-apple-os,
html.is-apple-os body {
  width: 100% !important;
  height: auto !important;
  min-height: auto !important;
  max-height: none !important;
  overflow-x: hidden !important;
  overflow-y: auto !important;
  position: static !important;
  touch-action: auto !important;
  -webkit-overflow-scrolling: touch !important;
}

html.is-apple-os .page,
html.is-apple-os form,
html.is-apple-os .card,
html.is-apple-os .card-body,
html.is-apple-os .checklist {
  height: auto !important;
  min-height: 0 !important;
  max-height: none !important;
  overflow: visible !important;
  position: static !important;
  transform: none !important;
  contain: none !important;
}

html.is-apple-os .hero,
html.is-apple-os .footer-actions {
  position: static !important;
  inset: auto !important;
  transform: none !important;
}

html.is-apple-os .page {
  padding-bottom: max(20px, env(safe-area-inset-bottom)) !important;
}

html.is-apple-os .footer-actions {
  margin: 12px 0 0 !important;
  padding: 10px !important;
  border-radius: 14px !important;
}
    @media print {
      .hero, .footer-actions, .btn, .toast { display: none !important; }
      body { background: #fff; }
      .page { padding: 0; }
      .card, .item { box-shadow: none; border-color: #ccc; }
      textarea { min-height: 90px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="hero-inner">
        <div class="title-wrap">
          <div class="eyebrow">Line Quality Monitoring Crew</div>
          <h1>품질 모니터링 점검 결과</h1>
          <p class="subtitle">안전/SVC 점검분야를 선택하여 작성 후 JSON 파일로 저장할 수 있습니다.</p>
        </div>
        <div class="hero-actions">
          <button class="btn btn-ghost" type="button" id="previewBtn">Data 미리보기</button>
          <button class="btn btn-primary" type="button" id="saveTopBtn">JSON 파일 저장</button>
        </div>
      </div>
    </header>

    <form id="monitoringForm" autocomplete="off">
      <section class="card">
        <div class="card-head">
          <div>
            <h2 class="card-title">기본 정보</h2>
            <p class="card-desc">점검 날짜, 편명, 작성자, 점검분야를 입력합니다.</p>
          </div>
        </div>
        <div class="card-body">
          <div class="grid">
            <div class="field third">
              <label class="field-label" for="inspectionDate">점검 날짜 <span class="required">*</span></label>
              <input type="date" id="inspectionDate" required />
              <div class="hint" id="dateText">달력에서 날짜를 선택하세요.</div>
            </div>

            <div class="field third">
              <label class="field-label" for="flightNumber">편명 <span class="required">*</span></label>
              <div class="flight-wrap">
                <span class="prefix">ZE</span>
                <input type="text" id="flightNumber" inputmode="numeric" maxlength="4" placeholder="예: 581" required />
              </div>
              <div class="hint">숫자만 입력하세요</div>
            </div>

            <div class="field third">
              <label class="field-label" for="category">점검분야 <span class="required">*</span></label>
              <select id="category" required>
                <option value="안전" selected>안전</option>
                <option value="SVC">서비스</option>
              </select>
              <div class="category-toggle" role="group" aria-label="점검분야 빠른 선택">
                <button class="category-toggle-btn active" type="button" data-category="안전">안전</button>
                <button class="category-toggle-btn" type="button" data-category="SVC">서비스</button>
              </div>
              <div class="hint">아이폰에서는 아래 빠른 선택 버튼을 사용하면 더 안정적으로 변경됩니다.</div>
            </div>

            <div class="field full">
              <label class="field-label" for="registrant">작성자 <span class="required">*</span></label>
              <input type="text" id="registrant" placeholder="예: 홍길동" required />
            </div>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <div>
            <h2 class="card-title">점검 항목</h2>
            <p class="card-desc" id="checklistDesc">안전 점검 항목을 작성합니다.</p>
          </div>
          <div class="progress-wrap">
            <span class="category-badge" id="categoryBadge">안전</span>
            <span id="progressText">0 / 12 선택</span>
            <div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
          </div>
        </div>
        <div class="card-body">
          <div class="checklist" id="checklist"></div>
        </div>
      </section>
    </form>

    <div class="footer-actions">
      <div class="save-note">JSON 파일 저장 / 취합·분석용 Data 생성</div>
      <div class="hero-actions">
        <button class="btn btn-ghost" type="button" id="resetBtn">초기화</button>
        <button class="btn btn-ghost" type="button" id="previewBottomBtn">Data 미리보기</button>
        <button class="btn btn-primary" type="button" id="saveBottomBtn">JSON 파일 저장</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle">저장될 JSON Data 미리보기</h2>
        <button class="btn btn-primary btn-small" type="button" id="copyJsonBtn">JSON 복사</button><button class="btn btn-ghost btn-small" type="button" id="closeModalBtn">닫기</button>
      </div>
      <div class="modal-body"><pre id="jsonPreview"></pre></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const checklistSets = {
      "안전": [
        "브리핑 시 난기류 지도 활용 여부",
        "보안 점검표에 의거한 보안점검 실시 여부",
        "Door Mode 변경 및 Operation 절차 준수 여부",
        "비상구 좌석 열 승객의 적정성 여부",
        "객실승무원의 이/착륙 시 충격방지 자세 실시여부",
        "승객 수하물의 적정 장소 보관 여부",
        "Moderate 이상 Turbulence 발생 시 절차 이행 여부",
        "비행중요 단계 시 안전업무 미수행 승무원의 Jump Seat 착석 및 좌석벨트 착용여부",
        "Oven 사용 시 Oven 장갑 사용 여부",
        "잘못된 문화 생성 사례",
        "그 외 안전규정 및 절차 미이행 건 및 비행 중 발견된 위해요인",
        "피로도 관련 의견"
      ],
      "SVC": [
        "승객 탑승 시 승객의 가시권에 위치하며 밝은 표정 및 올바른 자세 유지 여부",
        "정확하고 정중한 언어 사용 여부",
        "안전 점검 시 강압적인 태도 지양 및 협조요청 여부",
        "적절한 기내 방송 음량 상태 확인 여부",
        "승객의 요구사항을 충분히 경청 후 Call Button Reset 여부",
        "승객의 요청에 대해 즉시 수용불가 시 충분한 사유 설명 및 안내 여부",
        "적절한 식음료 Heating 여부",
        "식음료 서비스 규정 준수 여부",
        "정기적인 Walkaround를 실시하며 객실의 안전 및 쾌적성을 유지 여부",
        "Galley 내 소음관리(승무원 대화 포함)",
        "그 외 비행 중 발견된 SVC 품질 저하 요인"
      ]
    };

    const categoryLabels = {
      "안전": "안전",
      "SVC": "서비스"
    };

    const draftState = {};
    let currentCategory = "안전";

    const form = document.getElementById("monitoringForm");
    const checklist = document.getElementById("checklist");
    const inspectionDate = document.getElementById("inspectionDate");
    const flightNumber = document.getElementById("flightNumber");
    const category = document.getElementById("category");
    const categoryToggleButtons = Array.from(document.querySelectorAll(".category-toggle-btn"));
    const registrant = document.getElementById("registrant");
    const dateText = document.getElementById("dateText");
    const progressText = document.getElementById("progressText");
    const progressBar = document.getElementById("progressBar");
    const categoryBadge = document.getElementById("categoryBadge");
    const checklistDesc = document.getElementById("checklistDesc");
    const toast = document.getElementById("toast");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const jsonPreview = document.getElementById("jsonPreview");

    function getItems(categoryValue = category.value) {
      return checklistSets[categoryValue] || [];
    }

    function hasResultChoice(categoryValue, no) {
      if (categoryValue === "안전" && [10, 11, 12].includes(no)) return false;
      if (categoryValue === "SVC" && no === 11) return false;
      return true;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2100);
    }

    function saveCurrentDraft() {
      const items = getItems(currentCategory);
      draftState[currentCategory] = items.map((_, index) => {
        const no = index + 1;
        const checked = document.querySelector(`input[name="result_${no}"]:checked`);
        const commentEl = document.getElementById(`comment_${no}`);
        return {
          result: checked ? checked.value : "",
          comment: commentEl ? commentEl.value : ""
        };
      });
    }

    function renderChecklist(categoryValue = category.value) {
      const items = getItems(categoryValue);
      categoryBadge.textContent = categoryLabels[categoryValue] || categoryValue;
      checklistDesc.textContent = `${categoryLabels[categoryValue] || categoryValue} 점검 항목을 작성합니다.`;

      checklist.innerHTML = items.map((title, index) => {
        const no = index + 1;
        const choiceHtml = hasResultChoice(categoryValue, no) ? `
              <div class="choice-group" role="radiogroup" aria-label="${no}번 결과 선택">
                <label class="choice">
                  <input type="radio" name="result_${no}" value="만족" />
                  <span class="ok">만족</span>
                </label>
                <label class="choice">
                  <input type="radio" name="result_${no}" value="불만족" />
                  <span class="bad">불만족</span>
                </label>
              </div>` : `<span class="comment-only-badge">의견 입력</span>`;
        return `
          <article class="item">
            <div class="item-top">
              <h3 class="item-title">${no}. ${title}</h3>
              ${choiceHtml}
            </div>
            <div class="item-body">
              <div class="comment-label">
                <label for="comment_${no}">Comment</label>
                <span class="char-count" id="count_${no}">0자</span>
              </div>
              <textarea id="comment_${no}" name="comment_${no}" placeholder="해당 항목의 세부 내용을 입력하세요."></textarea>
            </div>
          </article>
        `;
      }).join("");

      checklist.querySelectorAll("input[type='radio']").forEach(input => {
        input.addEventListener("change", updateProgress);
      });

      items.forEach((_, index) => {
        const no = index + 1;
        const textarea = document.getElementById(`comment_${no}`);
        const count = document.getElementById(`count_${no}`);
        textarea.addEventListener("input", () => {
          count.textContent = `${textarea.value.length}자`;
        });
      });

      restoreDraft(categoryValue);
      updateProgress();
    }

    function restoreDraft(categoryValue) {
      const saved = draftState[categoryValue] || [];
      saved.forEach((item, index) => {
        const no = index + 1;
        if (item.result) {
          const radio = document.querySelector(`input[name="result_${no}"][value="${item.result}"]`);
          if (radio) radio.checked = true;
        }
        const textarea = document.getElementById(`comment_${no}`);
        const count = document.getElementById(`count_${no}`);
        if (textarea) textarea.value = item.comment || "";
        if (count) count.textContent = `${(item.comment || "").length}자`;
      });
    }

    function updateProgress() {
      const categoryValue = category.value;
      const items = getItems(categoryValue);
      let selected = 0;
      let choiceTotal = 0;
      items.forEach((_, index) => {
        const no = index + 1;
        if (!hasResultChoice(categoryValue, no)) return;
        choiceTotal++;
        if (document.querySelector(`input[name="result_${no}"]:checked`)) selected++;
      });
      progressText.textContent = `${selected} / ${choiceTotal} 선택`;
      progressBar.style.width = choiceTotal ? `${(selected / choiceTotal) * 100}%` : "0%";
    }

    function formatKoreanDate(value) {
      if (!value) return "달력에서 날짜를 선택하세요.";
      const d = new Date(`${value}T00:00:00`);
      const days = ["일", "월", "화", "수", "목", "금", "토"];
      return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;
    }

    function sanitizeFilename(text) {
      return String(text || "")
        .replace(/[\\/:*?"<>|]/g, "")
        .replace(/\s+/g, "_")
        .trim();
    }

    function collectData() {
      const categoryValue = category.value;
      const items = getItems(categoryValue).map((title, index) => {
        const no = index + 1;
        const resultRequired = hasResultChoice(categoryValue, no);
        const checked = resultRequired ? document.querySelector(`input[name="result_${no}"]:checked`) : null;
        const comment = document.getElementById(`comment_${no}`).value.trim();
        return {
          no,
          item: title,
          result: checked ? checked.value : "",
          resultRequired,
          comment
        };
      });

      const flightDigits = flightNumber.value.trim().replace(/[^0-9]/g, "");

      return {
        dataType: "monitoringCrewChecklist",
        version: "1.5-mobile-json-file-save",
        savedAt: new Date().toISOString(),
        inspectionDate: inspectionDate.value,
        inspectionDateText: formatKoreanDate(inspectionDate.value),
        flightNo: flightDigits ? `ZE ${flightDigits}` : "",
        author: registrant.value.trim(),
        registrant: registrant.value.trim(),
        category: categoryValue,
        categoryLabel: categoryLabels[categoryValue] || categoryValue,
        checklist: items,
        summary: {
          totalItems: items.length,
          resultChoiceItems: items.filter(item => item.resultRequired).length,
          selectedCount: items.filter(item => item.resultRequired && item.result).length,
          satisfiedCount: items.filter(item => item.result === "만족").length,
          unsatisfiedCount: items.filter(item => item.result === "불만족").length,
          unselectedCount: items.filter(item => item.resultRequired && !item.result).length
        }
      };
    }

    function validateData(data) {
      const missing = [];
      if (!data.inspectionDate) missing.push("점검 날짜");
      if (!data.flightNo) missing.push("편명");
      if (!data.author) missing.push("작성자");
      if (!data.category) missing.push("점검분야");

      const unselected = data.checklist.filter(item => item.resultRequired && !item.result).map(item => item.no);
      if (unselected.length) missing.push(`점검 결과 미선택 항목: ${unselected.join(", ")}번`);

      if (missing.length) {
        showToast("필수 입력값을 확인해 주세요.");
        alert(`다음 내용을 확인해 주세요.\n\n- ${missing.join("\n- ")}`);
        return false;
      }
      return true;
    }

    function saveJson() {
      const data = collectData();
      if (!validateData(data)) return;

      const text = JSON.stringify(data, null, 2);
      const datePart = data.inspectionDate || new Date().toISOString().slice(0, 10);
      const flightPart = sanitizeFilename(data.flightNo || "flight");
      const categoryPart = sanitizeFilename(data.categoryLabel || data.category || "category");
      const authorPart = sanitizeFilename(data.author || "author");
      const fileName = `quality-monitoring_${datePart}_${flightPart}_${categoryPart}_${authorPart}.json`;

      jsonPreview.textContent = text;
      modalBackdrop.style.display = "flex";
      showToast("JSON 파일 저장을 준비했습니다.");
      downloadJsonFile(text, fileName);
    }

    function downloadJsonFile(text, fileName) {
      const blob = new Blob([text], { type: "application/json;charset=utf-8" });

      function showFallback() {
        showJsonFallback(text);
      }

      function directDownload() {
        try {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = fileName;
          a.rel = "noopener";
          a.style.position = "fixed";
          a.style.left = "-9999px";
          a.style.top = "-9999px";
          document.body.appendChild(a);

          try {
            a.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window }));
          } catch (eventError) {
            a.click();
          }

          setTimeout(() => {
            try { document.body.removeChild(a); } catch (removeError) {}
            try { URL.revokeObjectURL(url); } catch (revokeError) {}
          }, 10000);
          showToast("JSON 파일 저장을 요청했습니다. 다운로드 폴더를 확인해 주세요.");
          return true;
        } catch (downloadError) {
          return false;
        }
      }

      async function shareFirst() {
        try {
          const file = new File([blob], fileName, { type: "application/json" });
          if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
            await navigator.share({
              files: [file],
              title: fileName,
              text: "JSON 파일 저장"
            });
            showToast("공유/파일 저장 화면이 실행되었습니다.");
            return true;
          }
        } catch (shareError) {
          // 사용자가 공유창을 닫았거나 브라우저가 제한한 경우 일반 다운로드로 재시도
          return false;
        }
        return false;
      }

      // GitHub Pages 등 웹주소 배포 환경에서는 Android에서 a.download가 무시될 수 있어
      // Android/iPhone 모두 공유/파일 저장창을 우선 실행하고, 실패 시 일반 다운로드를 재시도합니다.
      shareFirst().then((shared) => {
        if (shared) return;
        const downloaded = directDownload();
        if (!downloaded) showFallback();
      }).catch(() => {
        const downloaded = directDownload();
        if (!downloaded) showFallback();
      });
    }

    function showJsonFallback(text) {
      jsonPreview.textContent = text;
      modalBackdrop.style.display = "flex";
      alert("이 브라우저에서 직접 다운로드가 제한될 수 있습니다. 내용을 복사해 .json 파일로 저장하세요.");
    }


    function copyTextToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise((resolve, reject) => {
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "readonly");
          ta.style.position = "fixed";
          ta.style.top = "0";
          ta.style.left = "0";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          const ok = document.execCommand("copy");
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error("copy failed"));
        } catch (e) {
          reject(e);
        }
      });
    }

    function copyJsonToClipboard() {
      const text = jsonPreview.textContent || JSON.stringify(collectData(), null, 2);
      copyTextToClipboard(text)
        .then(() => showToast("JSON 내용이 복사되었습니다."))
        .catch(() => alert("복사가 제한되었습니다. 미리보기 내용을 길게 눌러 직접 복사하세요."));
      return false;
    }

    function fallbackCopyText(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "readonly");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); showToast("JSON 내용이 복사되었습니다."); }
      catch (e) { alert("복사가 제한되었습니다. 미리보기 내용을 길게 눌러 직접 복사하세요."); }
      document.body.removeChild(ta);
    }

    function showPreview() {
      const data = collectData();
      jsonPreview.textContent = JSON.stringify(data, null, 2);
      modalBackdrop.style.display = "flex";
    }

    function closePreview() {
      modalBackdrop.style.display = "none";
    }

    function resetForm() {
      if (!confirm("입력한 내용을 모두 초기화할까요?")) return;
      form.reset();
      dateText.textContent = "달력에서 날짜를 선택하세요.";
      category.value = "안전";
      currentCategory = "안전";
      Object.keys(draftState).forEach(key => delete draftState[key]);
      renderChecklist("안전");
      categoryToggleButtons.forEach(btn => btn.classList.toggle("active", btn.dataset.category === "안전"));
      showToast("초기화되었습니다.");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function setInitialCategoryToggle() {
      categoryToggleButtons.forEach(btn => btn.classList.toggle("active", btn.dataset.category === category.value));
    }

    function init() {
      renderChecklist("안전");
      setInitialCategoryToggle();

      inspectionDate.addEventListener("change", () => {
        dateText.textContent = formatKoreanDate(inspectionDate.value);
      });

      flightNumber.addEventListener("input", () => {
        flightNumber.value = flightNumber.value.replace(/[^0-9]/g, "").slice(0, 4);
      });

      function applyCategoryChange(nextCategory, options = {}) {
        if (!checklistSets[nextCategory]) return;
        if (options.saveDraft !== false && currentCategory !== nextCategory) saveCurrentDraft();
        category.value = nextCategory;
        currentCategory = nextCategory;
        categoryToggleButtons.forEach(btn => btn.classList.toggle("active", btn.dataset.category === nextCategory));
        renderChecklist(nextCategory);
        checklist.offsetHeight;
        requestAnimationFrame(() => updateProgress());
        if (options.toast !== false) showToast(`${categoryLabels[nextCategory] || nextCategory} 점검 항목으로 변경되었습니다.`);
      }

      ["change", "input", "blur"].forEach(eventName => {
        category.addEventListener(eventName, () => applyCategoryChange(category.value));
      });

      categoryToggleButtons.forEach(button => {
        const choose = (event) => {
          event.preventDefault();
          applyCategoryChange(button.dataset.category);
        };
        button.addEventListener("click", choose);
        button.addEventListener("touchend", choose, { passive: false });
      });

      ["saveTopBtn", "saveBottomBtn"].forEach(id => document.getElementById(id).addEventListener("click", saveJson));
      ["previewBtn", "previewBottomBtn"].forEach(id => document.getElementById(id).addEventListener("click", showPreview));
      document.getElementById("resetBtn").addEventListener("click", resetForm);
      const copyJsonBtn = document.getElementById("copyJsonBtn");
      if (copyJsonBtn) copyJsonBtn.addEventListener("click", copyJsonToClipboard);
      document.getElementById("closeModalBtn").addEventListener("click", closePreview);
      modalBackdrop.addEventListener("click", (event) => {
        if (event.target === modalBackdrop) closePreview();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closePreview();
      });
    }

    init();
  </script>
</body>
</html>
